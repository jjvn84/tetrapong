[package]
name = "tetrapong"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = "0.20.1"
rand = "0.10.3"
strum = { version = "0.28.0", features = ["derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Shrink release binaries: drop symbols and let LLVM optimize across crates.
# LTO trades build time for a smaller, faster binary.
[profile.release]
strip = true
lto = "thin"
